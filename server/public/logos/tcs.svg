<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="100%" height="100%">
  <defs>
    <linearGradient id="tcsBlue" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#071b3e" />
      <stop offset="50%" stop-color="#0f3470" />
      <stop offset="100%" stop-color="#1955af" />
    </linearGradient>
    <linearGradient id="tcsAccent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#e02424" />
      <stop offset="50%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#00a3e0" />
    </linearGradient>
  </defs>
  <!-- Background Card -->
  <rect width="200" height="200" rx="36" fill="url(#tcsBlue)"/>
  
  <!-- Subtle Header TATA -->
  <text x="100" y="58" text-anchor="middle" fill="#93c5fd" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="800" font-size="16" letter-spacing="4">TATA</text>
  
  <!-- TCS Main Big Typography -->
  <text x="100" y="116" text-anchor="middle" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="900" font-size="52" letter-spacing="3">TCS</text>
  
  <!-- Modern Color Accent Line -->
  <rect x="42" y="130" width="116" height="4" rx="2" fill="url(#tcsAccent)"/>

  <!-- Subtitle -->
  <text x="100" y="156" text-anchor="middle" fill="#cbd5e1" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="700" font-size="10.5" letter-spacing="1">CONSULTANCY</text>
  <text x="100" y="172" text-anchor="middle" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="700" font-size="10" letter-spacing="1.5">SERVICES</text>
</svg>

version: '3.8'

services:
  # MongoDB Database Service
  mongodb:
    image: mongo:6.0
    container_name: internconnect-mongodb
    restart: always
    ports:
      - '27017:27017'
    volumes:
      - mongo-data:/data/db
    environment:
      - MONGO_INITDB_DATABASE=internconnect

  # Backend API Service
  server:
    build:
      context: ./server
      dockerfile: Dockerfile
    container_name: internconnect-server
    restart: always
    ports:
      - '5000:5000'
    environment:
      - PORT=5000
      - MONGODB_URI=mongodb://mongodb:27017/internconnect
      - JWT_SECRET=internconnect_super_secret_jwt_key_2024_secure_fsd_project
      - CLIENT_URL=http://localhost:80
    depends_on:
      - mongodb

  # Frontend Client Service
  client:
    build:
      context: ./client
      dockerfile: Dockerfile
    container_name: internconnect-client
    restart: always
    ports:
      - '80:80'
    depends_on:
      - server

volumes:
  mongo-data:
